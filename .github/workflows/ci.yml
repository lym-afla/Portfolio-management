name: CI

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django system check
        run: uv run python manage.py check

      - name: Check migrations are committed
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run complete backend test suite
        run: uv run python -m pytest

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run complete frontend unit suite
        run: npm run test:unit

      - name: Run Vue and TypeScript lint gates
        run: npm run lint

      - name: Run global type check
        run: npm run type-check

      - name: Run strict reliability type check
        run: npm run type-check:reliability

      - name: Build production frontend
        run: npm run build

      - name: Install browser runtime
        run: npm exec agent-browser -- install --with-deps

      - name: Run browser route matrix
        run: npm run test:browser

      - name: Upload browser logs and failed screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-ci
          path: |
            frontend/tests/browser/artifacts/browser.log
            frontend/tests/browser/artifacts/summary.json
            frontend/tests/browser/artifacts/screenshots/
          if-no-files-found: warn

  doc-drift-check:
    name: Doc drift guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assert frontend/ directory exists (not portfolio-frontend/)
        run: |
          if [ ! -d frontend ]; then
            echo "ERROR: frontend/ directory missing. Was it renamed back to portfolio-frontend/?"
            exit 1
          fi
          if [ -d portfolio-frontend ]; then
            echo "ERROR: portfolio-frontend/ exists — should be renamed to frontend/."
            exit 1
          fi

      - name: Assert socket.io-client is not a dependency
        run: |
          if grep -q '"socket.io-client"' frontend/package.json; then
            echo "ERROR: socket.io-client found in frontend/package.json — it was removed (unused; app uses native WebSocket)."
            exit 1
          fi

      - name: Assert INSTALLED_APPS project apps are present
        run: |
          APPS=$(grep -A30 "^INSTALLED_APPS" backend/portfolio_management/settings.py \
            | grep -oP '^\s+"\K[a-z_]+' \
            | sort -u)
          echo "INSTALLED_APPS project apps: $APPS"
          for app in common users transactions database dashboard open_positions closed_positions summary_analysis; do
            if ! echo "$APPS" | grep -qx "$app"; then
              echo "ERROR: expected project app '$app' not found in INSTALLED_APPS."
              exit 1
            fi
          done

      - name: Assert SERVER_ENCRYPTION_KEY is not in settings
        run: |
          if grep -q "SERVER_ENCRYPTION_KEY" backend/portfolio_management/settings.py; then
            echo "ERROR: SERVER_ENCRYPTION_KEY found in settings — it was removed (dead config, regenerated per-restart, never read)."
            exit 1
          fi

      - name: Assert uv.lock is committed
        run: |
          if [ ! -f backend/uv.lock ]; then
            echo "ERROR: backend/uv.lock missing — uv project mode requires a committed lockfile."
            exit 1
          fi

      - name: Assert no requirements*.txt files exist
        run: |
          if ls backend/requirements*.txt 1> /dev/null 2>&1; then
            echo "ERROR: backend/requirements*.txt files exist — project migrated to uv project mode (pyproject.toml + uv.lock)."
            ls backend/requirements*.txt
            exit 1
          fi
