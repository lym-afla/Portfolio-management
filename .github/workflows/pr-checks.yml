name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run focused backend tests
        run: |
          python -m pytest \
            tests/integration/workflows/test_crypto_exchange_persistence.py \
            tests/unit/imports/test_crypto_exchange_import.py \
            tests/unit/api/test_crypto_exchange_clients.py \
            tests/integration/api/test_crypto_token_api.py \
            -q \
            --no-cov

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint for edited frontend files
        run: |
          npm run lint -- \
            src/components/BrokerTokenManager.vue \
            src/services/api.js \
            tests/unit/components/BrokerTokenManager.spec.js

      - name: Run token manager tests
        run: npm run test:unit -- BrokerTokenManager.spec.js
