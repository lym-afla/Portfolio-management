name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django system check
        run: uv run python manage.py check

      - name: Check migrations are committed
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run complete backend test suite
        run: uv run python -m pytest

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run complete frontend unit suite
        run: npm run test:unit

      - name: Run Vue and TypeScript lint gates
        run: npm run lint

      - name: Run global type check
        run: npm run type-check

      - name: Run strict reliability type check
        run: npm run type-check:reliability

      - name: Build production frontend
        run: npm run build

      - name: Install browser runtime
        run: npm exec agent-browser -- install --with-deps

      - name: Run browser route matrix
        run: npm run test:browser

      - name: Upload browser logs and failed screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-pr
          path: |
            frontend/tests/browser/artifacts/browser.log
            frontend/tests/browser/artifacts/summary.json
            frontend/tests/browser/artifacts/screenshots/
          if-no-files-found: warn
