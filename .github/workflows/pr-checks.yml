name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django system check
        run: uv run python manage.py check

      - name: Check migrations are committed
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run focused backend tests
        run: |
          uv run python -m pytest \
            tests/integration/workflows/test_crypto_exchange_persistence.py \
            tests/unit/imports/test_crypto_exchange_import.py \
            tests/unit/api/test_crypto_exchange_clients.py \
            tests/integration/api/test_crypto_token_api.py \
            -q \
            --no-cov

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint for edited frontend files
        run: |
          npm run lint -- \
            src/components/BrokerTokenManager.vue \
            src/services/api.js \
            tests/unit/components/BrokerTokenManager.spec.js

      - name: Run token manager tests
        run: npm run test:unit -- BrokerTokenManager.spec.js
